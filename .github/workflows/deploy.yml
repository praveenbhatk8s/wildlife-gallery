name: deploy

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write # GitHub OIDC -> AWS, no stored keys

env:
  AWS_REGION: eu-central-1
  TF_VAR_alert_email: ${{ vars.ALERT_EMAIL }}

jobs:
  test-and-plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: functions/process-photo/go.mod
          cache-dependency-path: functions/process-photo/go.sum

      - name: test and build Lambda
        run: make build

      - uses: hashicorp/setup-terraform@v3

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: terraform plan
        working-directory: infra
        run: |
          terraform fmt -check -recursive
          terraform init -input=false
          terraform validate
          terraform plan -input=false -lock=false

  apply:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test-and-plan
    runs-on: ubuntu-latest
    environment: aws-portfolio # required reviewer approves before AWS trusts this job
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: functions/process-photo/go.mod
          cache-dependency-path: functions/process-photo/go.sum

      - name: build Lambda
        run: make build

      - uses: hashicorp/setup-terraform@v3

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: terraform apply
        working-directory: infra
        run: |
          terraform init -input=false
          terraform apply -input=false -auto-approve
